<svg viewBox="0 0 1050 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1050" height="620" fill="#ffffff"/>
  <text x="525" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">IAM Trust &amp; Permission Split</text>
  <text x="525" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Why a compromised workflow can't grant itself more access</text>

  <!-- GitHub Actions -->
  <rect x="60" y="80" width="240" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">GitHub Actions workflow run</text>
  <text x="180" y="126" text-anchor="middle" font-size="10" fill="#4c1d95">repo: susu10-10/pulse-ecs-repo</text>
  <text x="180" y="139" text-anchor="middle" font-size="10" fill="#4c1d95">ref: refs/heads/main OR pull_request</text>

  <line x1="300" y1="115" x2="380" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="340" y="105" text-anchor="middle" font-size="10" fill="#4b5563">OIDC token</text>

  <!-- OIDC Provider -->
  <rect x="380" y="80" width="260" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">OIDC Provider</text>
  <text x="510" y="120" text-anchor="middle" font-size="10" fill="#1e3a8a">token.actions.githubusercontent.com</text>
  <text x="510" y="135" text-anchor="middle" font-size="10" fill="#1e3a8a">trusted in this AWS account</text>

  <line x1="640" y1="115" x2="720" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="680" y="105" text-anchor="middle" font-size="10" fill="#4b5563">verifies subject</text>

  <!-- Trust condition check -->
  <rect x="720" y="70" width="270" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="855" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Trust condition (immutable IDs)</text>
  <text x="855" y="107" text-anchor="middle" font-size="9" fill="#78350f">repo:susu10-10@75139663/</text>
  <text x="855" y="120" text-anchor="middle" font-size="9" fill="#78350f">pulse-ecs-repo@1356521771:</text>
  <text x="855" y="133" text-anchor="middle" font-size="9" fill="#78350f">ref:refs/heads/main | :pull_request</text>
  <text x="855" y="150" text-anchor="middle" font-size="9" font-style="italic" fill="#92400e">renamed/deleted-recreated repo can't match</text>

  <line x1="510" y1="150" x2="510" y2="210" stroke="#374151" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="525" y="185" font-size="10" fill="#4b5563">sts:AssumeRoleWithWebIdentity -&gt;</text>
  <text x="525" y="198" font-size="10" fill="#4b5563">short-lived credentials (~1hr)</text>

  <!-- Deploy Role -->
  <rect x="330" y="216" width="360" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="510" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">pulse-ecs-github-deploy-role</text>
  <text x="510" y="258" text-anchor="middle" font-size="10" fill="#065f46">The single identity every workflow assumes</text>

  <line x1="450" y1="276" x2="300" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="570" y1="276" x2="720" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Two policies -->
  <rect x="90" y="336" width="330" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">deploy-core policy</text>
  <text x="255" y="380" text-anchor="middle" font-size="10" fill="#374151">ECR push/pull, ECS cluster/service/</text>
  <text x="255" y="394" text-anchor="middle" font-size="10" fill="#374151">task-def, VPC/ALB/SG create+describe,</text>
  <text x="255" y="408" text-anchor="middle" font-size="10" fill="#374151">CloudWatch log group management</text>
  <text x="255" y="428" text-anchor="middle" font-size="10" fill="#374151">All scoped to pulse-ecs* names</text>
  <text x="255" y="450" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">Split from one policy — hit AWS's</text>
  <text x="255" y="462" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">6,144-char single-policy limit</text>

  <rect x="630" y="336" width="330" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="795" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">deploy-extra policy</text>
  <text x="795" y="380" text-anchor="middle" font-size="10" fill="#374151">ECS task-role IAM (scoped to</text>
  <text x="795" y="394" text-anchor="middle" font-size="10" fill="#374151">pulse-ecs-ecs-* only), S3 state,</text>
  <text x="795" y="408" text-anchor="middle" font-size="10" fill="#374151">ACM, SNS, CloudWatch alarms</text>
  <text x="795" y="428" text-anchor="middle" font-size="10" fill="#374151">+ read-only self-inspection</text>
  <text x="795" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">Cannot write to this role or</text>
  <text x="795" y="462" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">either policy — see below</text>

  <!-- Self-lock callout -->
  <rect x="230" y="500" width="590" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">The self-lock: what closes self-escalation</text>
  <text x="525" y="545" text-anchor="middle" font-size="10.5" fill="#374151">Neither policy grants write access (Create/Put/Attach/Delete) to this role's own</text>
  <text x="525" y="561" text-anchor="middle" font-size="10.5" fill="#374151">definition or to either policy document. IamSelfReadOnly grants Get/List only —</text>
  <text x="525" y="577" text-anchor="middle" font-size="10.5" fill="#374151">enough to plan/refresh, never enough to change what this role can do.</text>
  <text x="525" y="595" text-anchor="middle" font-size="9.5" font-style="italic" fill="#7f1d1d">Both policies live in a separate Terraform state CI never applies — human-only, local-only changes.</text>

</svg>
