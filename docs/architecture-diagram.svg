<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1100" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">pulse-ecs-pf — Request Path &amp; Infrastructure</text>
  <text x="550" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Internet -&gt; ALB (public subnet) -&gt; ECS Fargate task (private subnet) -&gt; supporting services</text>

  <!-- Internet -->
  <g>
    <ellipse cx="550" cy="105" rx="90" ry="34" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="550" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Internet</text>
  </g>
  <line x1="550" y1="139" x2="550" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="163" font-size="11" fill="#4b5563">HTTPS :443 (TLS) / HTTP :80 -&gt; 301 redirect</text>

  <!-- VPC boundary -->
  <rect x="60" y="188" width="980" height="540" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="212" font-size="13" font-weight="700" fill="#4b5563">VPC — 10.0.0.0/16</text>

  <!-- Public subnet -->
  <rect x="90" y="228" width="920" height="130" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="248" font-size="12" font-weight="700" fill="#065f46">Public Subnets (2 AZs) — 10.0.1.0/24, 10.0.2.0/24</text>

  <!-- ALB -->
  <rect x="440" y="262" width="220" height="70" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="550" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Application Load Balancer</text>
  <text x="550" y="306" text-anchor="middle" font-size="11" fill="#374151">SG: alb-sg (0.0.0.0/0 -&gt; 80/443 only)</text>
  <text x="550" y="321" text-anchor="middle" font-size="11" fill="#374151">Self-signed cert terminates TLS here</text>

  <!-- NAT gateway -->
  <rect x="750" y="262" width="180" height="70" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="840" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">NAT Gateway</text>
  <text x="840" y="308" text-anchor="middle" font-size="11" fill="#374151">Outbound only (ECR pulls,</text>
  <text x="840" y="321" text-anchor="middle" font-size="11" fill="#374151">CloudWatch Logs shipping)</text>

  <!-- arrow ALB -> private subnet -->
  <line x1="550" y1="332" x2="550" y2="392" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="368" font-size="11" fill="#4b5563">Forward :8080 (target group health check: /health)</text>

  <!-- Private subnet -->
  <rect x="90" y="398" width="920" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="418" font-size="12" font-weight="700" fill="#1e3a8a">Private Subnets (2 AZs) — 10.0.10.0/24, 10.0.11.0/24 — no public IPs, no direct internet exposure</text>

  <!-- ECS Task -->
  <rect x="400" y="436" width="300" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ECS Fargate Task — pulseservice</text>
  <text x="550" y="477" text-anchor="middle" font-size="11" fill="#374151">Container: pulsesvc (FastAPI, port 8080)</text>
  <text x="550" y="492" text-anchor="middle" font-size="11" fill="#374151">SG: ecs-tasks-sg (8080 from alb-sg only)</text>
  <text x="550" y="507" text-anchor="middle" font-size="11" fill="#374151">readonlyRootFilesystem, non-root user</text>

  <!-- NAT -> ECS outbound line -->
  <line x1="750" y1="332" x2="620" y2="436" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ECS Cluster label -->
  <rect x="740" y="436" width="230" height="90" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="855" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">ECS Cluster</text>
  <text x="855" y="478" text-anchor="middle" font-size="11" fill="#374151">pulse-ecs-ecs-cluster</text>
  <text x="855" y="493" text-anchor="middle" font-size="11" fill="#374151">Fargate capacity provider</text>
  <text x="855" y="508" text-anchor="middle" font-size="11" fill="#374151">Deployment circuit breaker: auto-rollback</text>

  <!-- Arrows down to supporting services -->
  <line x1="470" y1="526" x2="200" y2="600" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="526" x2="550" y2="600" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="526" x2="880" y2="600" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ECR -->
  <rect x="100" y="608" width="220" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">ECR</text>
  <text x="210" y="650" text-anchor="middle" font-size="11" fill="#374151">pulse-ecs/pulseservice</text>
  <text x="210" y="665" text-anchor="middle" font-size="11" fill="#374151">Image scan on push</text>
  <text x="210" y="680" text-anchor="middle" font-size="10" fill="#6b7280">(via NAT — no VPC endpoint yet)</text>

  <!-- CloudWatch Logs -->
  <rect x="440" y="608" width="220" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="550" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">CloudWatch Logs</text>
  <text x="550" y="650" text-anchor="middle" font-size="11" fill="#374151">/aws/ecs/pulseservice/pulsesvc</text>
  <text x="550" y="665" text-anchor="middle" font-size="11" fill="#374151">/aws/ecs/pulse-ecs-ecs-cluster</text>
  <text x="550" y="680" text-anchor="middle" font-size="10" fill="#6b7280">30-day retention</text>

  <!-- CloudWatch Alarms / SNS -->
  <rect x="770" y="608" width="220" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="880" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">CloudWatch Alarms</text>
  <text x="880" y="646" text-anchor="middle" font-size="11" fill="#374151">unhealthy-targets, high-5xx-rate</text>
  <text x="880" y="661" text-anchor="middle" font-size="11" fill="#374151">-&gt; SNS topic: pulse-ecs-alerts</text>
  <text x="880" y="676" text-anchor="middle" font-size="10" fill="#6b7280">-&gt; email subscription</text>

  <!-- Legend -->
  <text x="80" y="750" font-size="10" fill="#6b7280">Solid arrows = request/data path. Dashed arrow = outbound-only NAT path. Application container is never directly reachable from the internet.</text>
</svg>
