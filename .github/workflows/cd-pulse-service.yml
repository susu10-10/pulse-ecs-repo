name: "CD - Pulse Service"

on:
  push:
    branches: ["main"]
    paths:
      - 'terraform/**'
      - '.github/workflows/cd-pulse-service.yml'
  # workflow_run:
  #   workflows: ["Build and Push Pulse Images to ECR "]
  #   types: [completed]
  #   branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_ENV_DIR: terraform/envs/prod   


permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::767397659229:role/pulse-ecs-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6" 

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_ENV_DIR }} init
        env:
          TF_VAR_repo_id: ${{ secrets.REPO_ID }}
          TF_VAR_owner_id: ${{ secrets.OWNER_ID }}

      - name: Terraform plan
        id: plan
        run: terraform -chdir=${{ env.TF_ENV_DIR }} plan -no-color
        env:
          TF_VAR_repo_id: ${{ secrets.REPO_ID }}
          TF_VAR_owner_id: ${{ secrets.OWNER_ID }}


      - name: Terraform Apply
        #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=${{ env.TF_ENV_DIR }} apply -auto-approve -input=false
        env:
          TF_VAR_repo_id: ${{ secrets.REPO_ID }}
          TF_VAR_owner_id: ${{ secrets.OWNER_ID }}

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster pulse-ecs-ecs-cluster \
            --services pulseservice \
            --region ${{ env.AWS_REGION }}
 
      - name: Get ALB DNS name
        id: alb
        run: |
          DNS=$(terraform -chdir=${{ env.TF_ENV_DIR }} output -raw alb_dns_name)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"
 
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://${{ steps.alb.outputs.dns }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after all retries."
          echo "If this fires, the ECS circuit breaker (08_appservice.tf) should already have rolled the service back to the previous task definition revision automatically — this failure is the pipeline's visibility into that event, not the recovery mechanism itself."
          exit 1